<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Marble &amp; Tile Inc</title>
<meta name="description" content="First Marble & Tile Inc — instalación profesional de mármol, cerámica, encimeras, pisos y remodelaciones. / Professional marble and tile installation, countertops, flooring and remodeling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;
    --bg-panel:#ffffff;
    --dark:#1f2225;
    --dark-panel:#2a2d31;
    --ink:#22252a;
    --muted:#6c7076;
    --ink-light:#f6f3ec;
    --muted-light:#b7bac0;
    --gold:#b08d57;
    --gold-bright:#c9a463;
    --line:rgba(34,37,42,0.12);
    --line-dark:rgba(246,243,236,0.14);
    --serif:'Cormorant Garamond', serif;
    --sans:'Work Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%;}
  a{color:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-0.01em;margin:0;}
  p{margin:0;}
  ::selection{background:rgba(176,141,87,0.25);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .section-label{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

  /* ---- lang toggle ---- */
  .lang-pill{display:flex;background:rgba(255,255,255,0.08);border:1px solid var(--line-dark);border-radius:999px;padding:4px;gap:2px;}
  .lang-pill button{border:none;background:transparent;color:var(--muted-light);font-family:var(--sans);font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;}
  .lang-pill button.active{background:var(--gold);color:#201a10;}

  /* ---- header ---- */
  header{position:sticky;top:0;z-index:40;background:rgba(31,34,37,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-dark);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:20px;color:var(--ink-light);}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .brand-word{font-family:var(--serif);line-height:1.1;}
  .brand-word .l1{font-size:18px;font-weight:600;color:var(--ink-light);display:block;}
  .brand-word .l2{font-size:11px;letter-spacing:0.14em;color:var(--gold-bright);display:block;}
  .nav-links{display:flex;gap:26px;font-size:14.5px;color:var(--muted-light);}
  .nav-links a{text-decoration:none;padding:6px 0;border-bottom:1px solid transparent;}
  .nav-links a:hover{color:var(--ink-light);border-color:var(--gold);}
  .nav-right{display:flex;align-items:center;gap:16px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:6px;font-family:var(--sans);font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s ease, background .15s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-gold{background:var(--gold);color:#201a10;}
  .btn-gold:hover{background:var(--gold-bright);}
  .btn-ghost-dark{background:transparent;border-color:var(--line-dark);color:var(--ink-light);}
  .btn-ghost-dark:hover{border-color:var(--gold);}
  .btn-ghost-light{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost-light:hover{border-color:var(--gold);}
  .nav-cta{display:none;}
  @media (min-width:880px){.nav-cta{display:inline-flex;}}

  /* ---- hero ---- */
  .hero{position:relative;background:var(--dark);color:var(--ink-light);overflow:hidden;}
  .hero-veins{position:absolute;inset:0;opacity:0.14;}
  .hero-inner{position:relative;z-index:1;padding:100px 0 90px;display:grid;grid-template-columns:1.15fr 0.85fr;gap:48px;align-items:center;}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--gold-bright);font-weight:700;margin-bottom:22px;letter-spacing:0.03em;text-transform:uppercase;}
  .hero-eyebrow::before{content:"";width:22px;height:1px;background:var(--gold);display:inline-block;}
  .hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.08;max-width:16ch;}
  .hero h1 .accent{color:var(--gold-bright);}
  .hero p.lead{margin-top:22px;font-size:17.5px;color:var(--muted-light);max-width:48ch;}
  .hero-ctas{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
  .hero-badges{display:flex;gap:26px;margin-top:46px;flex-wrap:wrap;}
  .hero-badges div{font-size:13.5px;color:var(--muted-light);display:flex;align-items:center;gap:8px;}
  .hero-badges svg{flex-shrink:0;color:var(--gold-bright);}
  .hero-art{display:flex;justify-content:center;}
  .hero-art svg{width:100%;max-width:300px;}

  /* ---- section ---- */
  section{padding:84px 0;border-top:1px solid var(--line);}
  .section-head{max-width:60ch;margin-bottom:44px;}
  .section-head h2{font-size:clamp(26px,3.2vw,36px);}
  .section-head p{margin-top:14px;color:var(--muted);font-size:16px;}

  /* ---- services ---- */
  .services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .service{background:var(--bg-panel);padding:32px 26px;}
  .service svg{color:var(--gold);margin-bottom:18px;}
  .service h3{font-size:18px;margin-bottom:10px;}
  .service p{font-size:14px;color:var(--muted);}

  /* ---- gallery ---- */
  .gallery-note{background:rgba(176,141,87,0.09);border:1px solid rgba(176,141,87,0.35);border-radius:10px;padding:16px 20px;font-size:14px;color:var(--ink);margin-bottom:32px;}
  .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .gallery-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);}
  .gallery-item .cap{margin-top:10px;font-size:14px;font-weight:600;}

  /* ---- why us ---- */
  .why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;}
  .why{text-align:left;}
  .why-num{font-family:var(--serif);font-size:34px;color:var(--gold);margin-bottom:10px;}
  .why h3{font-size:16.5px;margin-bottom:8px;}
  .why p{font-size:14px;color:var(--muted);}

  /* ---- contact ---- */
  .contact-section{background:var(--dark);color:var(--ink-light);}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:48px;}
  .contact-card{background:var(--dark-panel);border:1px solid var(--line-dark);border-radius:14px;padding:28px;}
  .contact-card svg{color:var(--gold-bright);margin-bottom:16px;}
  .contact-card h3{font-size:18px;margin-bottom:8px;color:var(--ink-light);}
  .contact-card p{font-size:14px;color:var(--muted-light);margin-bottom:18px;}
  .contact-card .btn{width:100%;justify-content:center;}
  .contact-placeholder{font-size:13px;color:var(--gold-bright);opacity:0.85;margin-top:10px;}

  .form-wrap{background:var(--dark-panel);border:1px solid var(--line-dark);border-radius:14px;padding:36px;}
  .form-wrap h3{color:var(--ink-light);font-size:20px;margin-bottom:22px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .form-field{display:flex;flex-direction:column;gap:6px;}
  .form-field.full{grid-column:1/-1;}
  .form-field label{font-size:12.5px;color:var(--muted-light);font-weight:600;}
  .form-field input, .form-field textarea{
    background:rgba(255,255,255,0.06);border:1px solid var(--line-dark);border-radius:8px;
    padding:12px 14px;color:var(--ink-light);font-family:var(--sans);font-size:14.5px;resize:vertical;
  }
  .form-field input::placeholder, .form-field textarea::placeholder{color:var(--muted-light);}
  .form-wrap .btn{margin-top:6px;}

  /* ---- footer ---- */
  footer{background:#17191c;color:var(--muted-light);padding:56px 0 26px;}
  .foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px;}
  .foot-brand{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .foot-brand svg{width:40px;height:40px;}
  .foot-brand span{font-family:var(--serif);color:var(--ink-light);font-size:18px;font-weight:600;}
  footer p.tag{font-size:14px;max-width:32ch;}
  footer h4{font-size:13px;color:var(--ink-light);margin-bottom:16px;letter-spacing:0.03em;text-transform:uppercase;}
  footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  footer a{text-decoration:none;font-size:14px;color:var(--muted-light);}
  footer a:hover{color:var(--gold-bright);}
  .foot-bottom{margin-top:48px;padding-top:22px;border-top:1px solid var(--line-dark);display:flex;justify-content:space-between;font-size:12.5px;flex-wrap:wrap;gap:10px;}

  @media (max-width:920px){
    .nav-links{display:none;}
    .hero-inner{grid-template-columns:1fr;padding-top:56px;}
    .hero-art{order:-1;}
    .services-grid{grid-template-columns:1fr 1fr;}
    .gallery-grid{grid-template-columns:1fr 1fr;}
    .why-grid{grid-template-columns:1fr 1fr;}
    .contact-grid{grid-template-columns:1fr;}
    .form-row{grid-template-columns:1fr;}
    .foot-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#inicio" class="brand" id="logo-nav"></a>
    <nav class="nav-links">
      <a href="#servicios" class="i18n" data-es="Servicios" data-en="Services"></a>
      <a href="#materiales" class="i18n" data-es="Materiales" data-en="Materials"></a>
      <a href="#nosotros" class="i18n" data-es="Nosotros" data-en="About"></a>
      <a href="#contacto" class="i18n" data-es="Contacto" data-en="Contact"></a>
    </nav>
    <div class="nav-right">
      <div class="lang-pill" id="lang-pill">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="en">EN</button>
      </div>
      <a href="#contacto" class="btn btn-gold nav-cta i18n" data-es="Cotizar" data-en="Get a Quote"></a>
    </div>
  </div>
</header>

<main>
  <!-- HERO -->
  <section id="inicio" class="hero" style="border-top:none;">
    <svg class="hero-veins" viewBox="0 0 1180 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0,120 C150,180 250,60 400,140 S650,220 800,120 S1050,60 1180,140" stroke="#c9a463" stroke-width="1.5" fill="none"/>

    </svg>
    <div class="wrap hero-inner">
      <div>
        <div class="hero-eyebrow i18n" data-es="Mármol · Cerámica · Encimeras" data-en="Marble · Tile · Countertops"></div>
        <h1><span class="i18n" data-es="Mármol y cerámica que " data-en="Marble and tile that "></span><span class="accent i18n" data-es="transforman tus espacios" data-en="transform your spaces"></span>.</h1>
        <p class="lead i18n" data-es="En First Marble &amp; Tile Inc convertimos pisos, encimeras y paredes en acabados de alta gama, con materiales de calidad e instalación profesional." data-en="At First Marble &amp; Tile Inc we turn floors, countertops and walls into high-end finishes, with quality materials and professional installation."></p>
        <div class="hero-ctas">
          <a href="#contacto" class="btn btn-gold i18n" data-es="Solicitar cotización" data-en="Request a Quote"></a>
          <a href="#materiales" class="btn btn-ghost-dark i18n" data-es="Ver materiales" data-en="View Materials"></a>
        </div>
        <div class="hero-badges">
          <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span class="i18n" data-es="Materiales de primera calidad" data-en="Top-quality materials"></span></div>
          <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span class="i18n" data-es="Instalación profesional" data-en="Professional installation"></span></div>
          <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span class="i18n" data-es="Presupuesto sin compromiso" data-en="No-obligation estimate"></span></div>
        </div>
      </div>
      <div class="hero-art">
        <svg viewBox="0 0 260 300" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="20" y="20" width="100" height="100" rx="4" fill="#2a2d31" stroke="#b08d57" stroke-width="1.5"/>
          <rect x="130" y="20" width="100" height="100" rx="4" fill="#33363a" stroke="#b08d57" stroke-width="1.5"/>
          <rect x="20" y="130" width="100" height="100" rx="4" fill="#33363a" stroke="#b08d57" stroke-width="1.5"/>
          <rect x="130" y="130" width="100" height="100" rx="4" fill="#2a2d31" stroke="#b08d57" stroke-width="1.5"/>
          <path d="M30 50 Q60 40 70 70 T110 90" stroke="#c9a463" stroke-width="1.5" fill="none" opacity="0.8"/>
          <path d="M150 60 Q170 90 200 80 T220 110" stroke="#c9a463" stroke-width="1.2" fill="none" opacity="0.6"/>
          <path d="M40 160 Q70 180 60 210 T100 220" stroke="#c9a463" stroke-width="1.2" fill="none" opacity="0.6"/>

          <text x="125" y="260" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="20" fill="#c9a463" font-weight="600">FM&amp;T</text>
        </svg>
      </div>
    </div>
  </section>

  <!-- SERVICIOS -->
  <section id="servicios">
    <div class="wrap">
      <div class="section-head">
        <div class="section-label i18n" data-es="Lo que hacemos" data-en="What we do"></div>
        <h2 class="i18n" data-es="Nuestros servicios" data-en="Our services"></h2>
        <p class="i18n" data-es="Trabajamos cada proyecto de principio a fin, desde la selección del material hasta el acabado final." data-en="We handle every project from start to finish, from material selection to final finish."></p>
      </div>
      <div class="services-grid">
        <div class="service">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h18v18H3z"/><path d="M3 9c4 2 8-4 10 0s6 2 8 0" stroke-linecap="round"/></svg>
          <h3 class="i18n" data-es="Instalación de mármol" data-en="Marble installation"></h3>
          <p class="i18n" data-es="Pisos, paredes y detalles en mármol natural, con acabados pulidos o mate según tu proyecto." data-en="Floors, walls and details in natural marble, with polished or honed finishes to match your project."></p>
        </div>
        <div class="service">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
          <h3 class="i18n" data-es="Instalación de cerámica" data-en="Tile installation"></h3>
          <p class="i18n" data-es="Cerámica y porcelanato para cocinas, baños y espacios exteriores, con acabado uniforme y duradero." data-en="Ceramic and porcelain tile for kitchens, bathrooms and outdoor spaces, with a uniform, long-lasting finish."></p>
        </div>
        <div class="service">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h16v3H4z"/><path d="M6 11v9M18 11v9"/></svg>
          <h3 class="i18n" data-es="Encimeras (countertops)" data-en="Countertops"></h3>
          <p class="i18n" data-es="Encimeras de mármol, granito o cuarzo para cocinas y baños, medidas e instaladas a precisión." data-en="Marble, granite or quartz countertops for kitchens and bathrooms, precisely measured and installed."></p>
        </div>
        <div class="service">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21h18"/><path d="M5 21V9l7-6 7 6v12"/><path d="M9 21v-6h6v6"/></svg>
          <h3 class="i18n" data-es="Pisos y remodelaciones" data-en="Flooring & remodeling"></h3>
          <p class="i18n" data-es="Renovamos pisos completos y espacios enteros, coordinando cada etapa del proyecto." data-en="We renovate entire floors and spaces, coordinating every stage of the project."></p>
        </div>
      </div>
    </div>
  </section>

  <!-- MATERIALES -->
  <section id="materiales">
    <div class="wrap">
      <div class="section-head">
        <div class="section-label i18n" data-es="Catálogo de referencia" data-en="Reference catalog"></div>
        <h2 class="i18n" data-es="Materiales y acabados" data-en="Materials & finishes"></h2>
        <p class="i18n" data-es="Algunos de los tipos de mármol y cerámica con los que trabajamos, en distintos acabados y colores." data-en="Some of the marble and tile types we work with, in a range of finishes and colors."></p>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <!-- NOSOTROS / WHY US -->
  <section id="nosotros">
    <div class="wrap">
      <div class="section-head">
        <div class="section-label i18n" data-es="Por qué elegirnos" data-en="Why choose us"></div>
        <h2 class="i18n" data-es="Compromiso con cada detalle" data-en="Committed to every detail"></h2>
      </div>
      <div class="why-grid">
        <div class="why"><div class="why-num">01</div><h3 class="i18n" data-es="Materiales de calidad" data-en="Quality materials"></h3><p class="i18n" data-es="Trabajamos con proveedores confiables para garantizar mármol y cerámica de buena procedencia." data-en="We work with reliable suppliers to guarantee well-sourced marble and tile."></p></div>
        <div class="why"><div class="why-num">02</div><h3 class="i18n" data-es="Instalación profesional" data-en="Professional installation"></h3><p class="i18n" data-es="Cada proyecto se instala con atención al nivel, la alineación y el acabado final." data-en="Every project is installed with attention to level, alignment and final finish."></p></div>

        <div class="why"><div class="why-num">04</div><h3 class="i18n" data-es="Atención personalizada" data-en="Personalized service"></h3><p class="i18n" data-es="Te acompañamos desde la elección del material hasta la entrega final del espacio." data-en="We guide you from material selection through final delivery of the space."></p></div>
      </div>
    </div>
  </section>

  <!-- CONTACTO -->
  <section id="contacto" class="contact-section">
    <div class="wrap">
      <div class="section-head">
        <div class="section-label i18n" data-es="Hablemos de tu proyecto" data-en="Let's talk about your project"></div>
        <h2 class="i18n" data-es="Contáctanos" data-en="Contact us"></h2>
        <p class="i18n" data-es="Elige la forma de contacto que prefieras. Estamos agregando los datos finales de contacto muy pronto." data-en="Choose the contact method you prefer. We're adding our final contact details very soon."></p>
      </div>

      <div class="contact-grid">
        <div class="contact-card">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.08L2 22l5.1-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.1-.44-4.38-1.2l-.31-.19-3.03.8.81-2.95-.2-.31A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
          <h3>WhatsApp</h3>
          <p class="i18n" data-es="Escríbenos directamente y te respondemos lo antes posible." data-en="Message us directly and we'll get back to you as soon as possible."></p>
          <a href="https://wa.me/10000000000" id="wa-link" target="_blank" rel="noopener" class="btn btn-gold i18n" data-es="Escribir por WhatsApp" data-en="Message on WhatsApp"></a>
          <div class="contact-placeholder">+1 (000) 000-0000 — <span class="i18n" data-es="pendiente por confirmar" data-en="to be confirmed"></span></div>

        <div class="contact-card">

<script>
/* ================= LOGO ================= */
function logoSvg(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="4" y="4" width="26" height="26" rx="2" fill="#2a2d31" stroke="#b08d57" stroke-width="1.3"/>
    <rect x="34" y="4" width="26" height="26" rx="2" fill="#1f2225" stroke="#b08d57" stroke-width="1.3"/>
    <rect x="4" y="34" width="26" height="26" rx="2" fill="#1f2225" stroke="#b08d57" stroke-width="1.3"/>
    <rect x="34" y="34" width="26" height="26" rx="2" fill="#2a2d31" stroke="#b08d57" stroke-width="1.3"/>
    <path d="M8 14 Q16 10 20 18 T30 20" stroke="#c9a463" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M38 44 Q46 40 50 48 T60 50" stroke="#c9a463" stroke-width="1.2" fill="none" opacity="0.85"/>
  </svg>`;
}
document.getElementById('logo-nav').innerHTML = `
  ${logoSvg(38)}
  <span class="brand-word"><span class="l1">First Marble &amp; Tile</span><span class="l2">INC.</span></span>
`;
document.getElementById('logo-footer').innerHTML = `
  ${logoSvg(40)}
  <span>First Marble &amp; Tile</span>
`;

/* ================= I18N ================= */
let currentLang = (navigator.language || 'es').toLowerCase().startsWith('en') ? 'en' : 'es';

function applyLang(lang){
  currentLang = lang;
  document.querySelectorAll('.i18n').forEach(el=>{
    const val = el.dataset[lang];
    if(val !== undefined) el.textContent = val;
  });
  document.documentElement.lang = lang;
  document.querySelectorAll('#lang-pill button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}
document.getElementById('lang-pill').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  applyLang(btn.dataset.lang);
});
applyLang(currentLang);

/* ================= GALLERY ================= */
const MATERIALS = [
  {img:"assets/img/marmol-blanco.jpg", es:"Mármol blanco", en:"White marble"},
  {img:"assets/img/marmol-negro.jpg", es:"Mármol negro", en:"Black marble"},
  {img:"assets/img/marmol-dorado.jpg", es:"Mármol dorado", en:"Gold-veined marble"},
  {img:"assets/img/ceramica-subway.jpg", es:"Cerámica subway", en:"Subway tile"},
  {img:"assets/img/mosaico.jpg", es:"Mosaico", en:"Mosaic tile"},
  {img:"assets/img/formato-grande.jpg", es:"Formato grande", en:"Large format tile"},
];
document.getElementById('gallery-grid').innerHTML = MATERIALS.map(m => `
  <div class="gallery-item">
    <img src="${m.img}" alt="${m.es}" loading="lazy">
    <div class="cap i18n" data-es="${m.es}" data-en="${m.en}">${currentLang === 'en' ? m.en : m.es}</div>
  </div>
`).join('');
// re-apply language to freshly-inserted gallery captions
applyLang(currentLang);

/* ================= CONTACT FORM (mailto fallback) ================= */
document.getElementById('contact-form').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('f-name').value;
  const phone = document.getElementById('f-phone').value;
  const email = document.getElementById('f-email').value;
  const message = document.getElementById('f-message').value;
  const subject = encodeURIComponent(`Solicitud de cotización — ${name}`);
  const body = encodeURIComponent(
    `Nombre: ${name}\nTeléfono: ${phone}\nEmail: ${email}\n\nProyecto:\n${message}`
  );
  window.location.href = `mailto:info@firstmarbleandtile.com?subject=${subject}&body=${body}`;
});
</script>
